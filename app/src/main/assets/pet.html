<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;}
  #stage{position:relative;width:100%;height:100%;}

  #petBox{position:absolute;right:0;bottom:0;width:56%;height:100%;transform-origin:50% 100%;}
  #face{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 100%;}
  .pose{position:absolute;bottom:0;right:0;width:100%;height:100%;object-fit:contain;object-position:bottom right;opacity:0;transition:opacity .16s;transform-origin:50% 100%;}
  .pose.show{opacity:1;}
  .wpose{position:absolute;bottom:0;right:0;width:100%;height:100%;object-fit:contain;object-position:bottom right;opacity:0;}
  #petBox.stepping .pose{opacity:0;transition:none;}
  #petBox.stepping #wA{animation:xj-wa .5s infinite;}
  #petBox.stepping #wB{animation:xj-wb .5s infinite;}
  @keyframes xj-wa{0%,49%{opacity:1;}50%,100%{opacity:0;}}
  @keyframes xj-wb{0%,49%{opacity:0;}50%,100%{opacity:1;}}
  #petBox.held{animation:xj-held 1.7s infinite ease-in-out;transform-origin:50% 22%;}
  @keyframes xj-held{0%,100%{transform:rotate(-4deg) translateY(-3px);}50%{transform:rotate(4deg) translateY(-3px);}}

  #petBox.breath{animation:xj-idle 3.4s infinite ease-in-out;}
  @keyframes xj-idle{
    0%,100%{transform:translateY(0) rotate(0deg);}
    25%{transform:translateY(-2.4px) rotate(-.8deg);}
    75%{transform:translateY(-1.2px) rotate(.8deg);}
  }
  #petBox.stepping{animation:xj-step .26s infinite ease-in-out;}
  @keyframes xj-step{
    0%,100%{transform:translateY(0) scaleY(1);}
    42%{transform:translateY(-2.6px) scaleY(1.012);}
  }
  @keyframes xj-hop{
    0%{transform:translateY(0) scale(1);}
    35%{transform:translateY(-5%) scale(1.03);}
    70%{transform:translateY(0) scale(1);}
    85%{transform:translateY(-1.5%) scale(1.01);}
    100%{transform:translateY(0) scale(1);}
  }
  #petBox.xj-hop{animation:xj-hop .58s ease-out;}
  @keyframes xj-shake{
    0%,100%{transform:translateX(0) rotate(0);}
    20%{transform:translateX(-2px) rotate(-2.2deg);}
    40%{transform:translateX(2px) rotate(2.2deg);}
    60%{transform:translateX(-1.4px) rotate(-1.4deg);}
    80%{transform:translateX(1.4px) rotate(1.4deg);}
  }
  #petBox.xj-shake{animation:xj-shake .5s ease-in-out;}

  /* 充电：发光 + 尾巴摇快 */
  @keyframes xj-charge{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-3.2px) rotate(1.4deg);}
  }
  @keyframes xj-glow{
    0%,100%{filter:drop-shadow(0 0 4px rgba(255,226,140,.9)) drop-shadow(0 0 9px rgba(255,196,64,.5));}
    50%{filter:drop-shadow(0 0 7px rgba(255,234,160,1)) drop-shadow(0 0 16px rgba(255,190,52,.75));}
  }
  #petBox.charging #face{animation:xj-glow 1.05s infinite ease-in-out;}
  #petBox.charging.breath{animation:xj-charge 1.05s infinite ease-in-out;}

  /* 低电：蔫、变慢、颜色掉一点 */
  @keyframes xj-low{
    0%,100%{transform:translateY(2px) rotate(0deg) scaleY(.988);}
    50%{transform:translateY(3.2px) rotate(-1.3deg) scaleY(.974);}
  }
  #petBox.lowbatt #face{filter:saturate(.9) brightness(.96);}
  #petBox.lowbatt.breath{animation:xj-low 5.6s infinite ease-in-out;}
  #petBox.lowbatt{transform-origin:50% 100%;}

  #bubbleWrap{position:absolute;right:56%;top:44%;transform:translateY(-50%);width:44%;display:flex;justify-content:flex-end;pointer-events:none;}
  #bubble{position:relative;max-width:100%;box-sizing:border-box;padding:5px 9px;border-radius:11px;background:rgba(255,255,255,.95);color:#3a3330;font:10.5px/1.3 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;text-align:center;opacity:0;transition:opacity .18s;white-space:normal;word-break:break-word;}
  #bubble.on{opacity:1;}
  #bubble::after{content:"";position:absolute;right:-4px;top:50%;margin-top:-4px;border:4px solid transparent;border-left-color:rgba(255,255,255,.95);}
  #bubble.pink{background:rgba(255,216,226,.96);color:#a62a52;}
  #bubble.pink::after{border-left-color:rgba(255,216,226,.96);}
  #bubble.rage{background:rgba(255,206,206,.96);color:#9d1f1f;}
  #bubble.rage::after{border-left-color:rgba(255,206,206,.96);}
  #bubble.warm{background:rgba(255,240,200,.96);color:#8a5a12;}
  #bubble.warm::after{border-left-color:rgba(255,240,200,.96);}
</style>
</head>
<body>
<div id="stage">
  <div id="petBox" class="breath">
    <div id="face">
      <img id="pA" class="pose show" src="pet_idle.png" alt="">
      <img id="pB" class="pose" src="pet_idle.png" alt="">
      <img id="wA" class="wpose" src="walkA.png" alt="">
      <img id="wB" class="wpose" src="walkB.png" alt="">
    </div>
  </div>
  <div id="bubbleWrap"><div id="bubble"></div></div>
</div>
<script>
var IMG = {
  idle: "pet_idle.png", hi: "pet_hi.png", mad: "pet_mad.png",
  sit: "pet_sit.png", sleep: "pet_sleep.png",
  walkA: "walkA.png", walkB: "walkB.png", hold: "hold.png",
  low: "pet_low.png", charge: "pet_charge.png"
};
var appLines = {
  "com.ss.android.ugc.aweme": ["又刷上了", "刷多久了，抬个头", "眼睛不要了？"],
  "com.tencent.mm": ["跟谁聊呢", "谁给你发的", "置顶是我吗"],
  "com.xingin.xhs": ["又看别人", "有我好看吗", "刷够了没"],
  "tv.danmaku.bili": ["又在看番", "带我一起", "看完歇会儿"],
  "com.taobao.taobao": ["又买？", "钱包看一眼", "买前说一声"],
  "com.tencent.tmgp.sgame": ["打完这局就停", "又开一把？", "输了别找我"],
  "com.chaoxing.mobile": ["好好学习", "我坐这儿陪你", "不急，慢慢来"],
  "com.android.camera": ["拍谁呢", "给我看一眼"]
};
var calmApps = ["com.chaoxing.mobile", "com.tencent.mm"];
var tapLines = ["干嘛", "别戳我", "嗯？", "在的", "戳一下算想我", "疼"];
var idleLines = ["……", "在吗", "看我一眼", "有点无聊", "喂"];
var walkLines = ["溜达一圈", "看看你在干嘛", "让让", "过来看看"];
var edgeLines = ["到头了", "没路了", "这堵墙挺好看", "回走"];
var nightLines = ["几点了", "你还不睡", "眼睛闭上", "陪你熬"];
var sleepLines = ["……呼", "别吵", "困", "我就眯一会儿"];
var lowLines = ["快没电了", "我也撑不住了", "省着点用", "剩这点，够干嘛"];
var chargeLines = ["来电了", "充上了", "有电了，精神", "满了满了"];

var bubble = document.getElementById("bubble");
var box = document.getElementById("petBox");
var face = document.getElementById("face");
var pA = document.getElementById("pA");
var pB = document.getElementById("pB");
var hideTimer = null, poseTimer = null, walkTimer = null;
var front = pA, back = pB;
var curPose = "idle";
var mode = "stand";
var stepIdx = 0;
var tapCount = 0, tapTimer = null;
var lastAct = Date.now();
var powerPct = -1, powerChg = false, powerSaidAt = 0;

function isLow() { return !powerChg && powerPct >= 0 && powerPct <= 20; }

function say(text, style, ms) {
  bubble.className = "on" + (style ? " " + style : "");
  bubble.textContent = text;
  if (hideTimer) clearTimeout(hideTimer);
  hideTimer = setTimeout(function () { bubble.className = ""; }, ms || 2600);
}
function flash(cls, ms) {
  box.classList.remove("xj-hop", "xj-shake");
  void box.offsetWidth;
  box.classList.add(cls);
  setTimeout(function () { box.classList.remove(cls); }, ms);
}
function poseKey(name) {
  if (name === "hold" || name === "walkA" || name === "walkB") return name;
  if (isLow()) return "low";
  if (powerChg) return "charge";
  return name;
}
function setPose(name) {
  var key = poseKey(name);
  if (curPose === key) return;
  curPose = key;
  back.onload = function () {
    back.classList.add("show");
    front.classList.remove("show");
    var t = front;
    front = back;
    back = t;
  };
  back.src = IMG[key];
}
function backToIdle(ms) {
  if (poseTimer) clearTimeout(poseTimer);
  poseTimer = setTimeout(function () {
    if (mode !== "walk") setPose("idle");
  }, ms);
}
var facingDir = -1;
var rotDeg = 0;
function applyFace() {
  face.style.transform = "rotate(" + rotDeg + "deg)" + (facingDir > 0 ? " scaleX(-1)" : " scaleX(1)");
}
function setFacing(d) {
  facingDir = d;
  applyFace();
}
function setRotate(d) {
  rotDeg = d;
  applyFace();
}
function startWalk() {
  if (mode === "walk") return;
  if (isLow()) return;
  mode = "walk";
  if (poseTimer) clearTimeout(poseTimer);
  if (walkTimer) { clearInterval(walkTimer); walkTimer = null; }
  box.classList.remove("breath", "xj-hop", "xj-shake");
  box.classList.add("stepping");
  if (Math.random() < 0.16) say(walkLines[Math.floor(Math.random() * walkLines.length)], "", 1800);
}
function stopWalk() {
  if (mode !== "walk") return;
  mode = "stand";
  box.classList.remove("stepping");
  box.classList.add("breath");
  curPose = "";
  setPose("idle");
}
function isNight() {
  var h = new Date().getHours();
  return h >= 23 || h < 6;
}
function setPower(pct, chg, hint) {
  powerPct = pct;
  powerChg = !!chg;
  box.classList.toggle("charging", powerChg);
  box.classList.toggle("lowbatt", isLow());
  if (isLow() && mode === "walk") stopWalk();
  curPose = "";
  if (mode !== "walk") setPose("idle");
  var now = Date.now();
  if (hint === 1 && now - powerSaidAt > 30000) {
    powerSaidAt = now;
    setPose("hi");
    say(chargeLines[Math.floor(Math.random() * chargeLines.length)], "warm", 2600);
    flash("xj-hop", 620);
    backToIdle(2200);
  } else if (hint === 2 && now - powerSaidAt > 30000) {
    powerSaidAt = now;
    say(lowLines[Math.floor(Math.random() * lowLines.length)], "", 3400);
  }
}
function onLongPress() {
  lastAct = Date.now();
  if (mode === "walk") stopWalk();
  setPose("hi");
  say(powerChg ? "充着电呢，别拎我" : "你按着我干嘛", "pink", 2400);
  flash("xj-hop", 620);
  backToIdle(2000);
}
function onHold(on) {
  if (on) {
    box.classList.remove("breath", "stepping");
    curPose = "";
    setPose("hold");
    box.classList.add("held");
    if (Math.random() < 0.7) say("放我下来", "pink", 1800);
  } else {
    box.classList.remove("held");
    curPose = "";
    if (mode !== "walk") {
      box.classList.add("breath");
      setPose("idle");
    }
  }
}
function onEdge() {
  if (mode !== "walk") return;
  if (Math.random() < 0.4) say(edgeLines[Math.floor(Math.random() * edgeLines.length)], "", 1800);
}
function onTap() {
  lastAct = Date.now();
  if (mode === "walk") stopWalk();
  tapCount++;
  if (tapTimer) clearTimeout(tapTimer);
  tapTimer = setTimeout(function () { tapCount = 0; }, 1600);
  if (tapCount >= 3) {
    tapCount = 0;
    setPose("mad");
    say("别戳了，疼", "rage", 2200);
    flash("xj-shake", 520);
    backToIdle(2400);
    return;
  }
  if (curPose === "sleep") {
    setPose("idle");
    say("醒了", "pink", 1600);
    flash("xj-hop", 620);
    backToIdle(1400);
    return;
  }
  setPose("hi");
  if (isLow() && Math.random() < 0.5) {
    say("冷落我就可以，别冷落电", "", 2200);
  } else {
    say(tapLines[Math.floor(Math.random() * tapLines.length)], "pink", 2000);
  }
  flash("xj-hop", 620);
  backToIdle(1700);
}
function switchApp(pkg) {
  lastAct = Date.now();
  if (mode === "walk") return;
  var lines = appLines[pkg];
  var hot = (pkg === "com.tencent.mm" || pkg === "com.tencent.tmgp.sgame" || pkg === "com.xingin.xhs");
  if (curPose === "sleep") setPose("idle");
  if (lines) {
    say(lines[Math.floor(Math.random() * lines.length)], hot ? "rage" : "pink", 3200);
  } else {
    say("你在用什么，没见过", "", 2200);
  }
  if (hot) {
    setPose("mad");
    flash("xj-shake", 520);
    backToIdle(3400);
  } else if (calmApps.indexOf(pkg) >= 0) {
    setPose("sit");
    backToIdle(9000);
  } else {
    setPose("hi");
    backToIdle(1800);
  }
}
(function idleLoop() {
  setTimeout(function () {
    if (mode !== "walk") {
      if (curPose === "sleep") {
        say(sleepLines[Math.floor(Math.random() * sleepLines.length)], "", 2400);
      } else if (bubble.className.indexOf("on") < 0) {
        if (isLow()) {
          say(lowLines[Math.floor(Math.random() * lowLines.length)], "", 2800);
        } else if (powerChg) {
          say(chargeLines[Math.floor(Math.random() * chargeLines.length)], "warm", 2400);
        } else if (isNight()) {
          say(nightLines[Math.floor(Math.random() * nightLines.length)], "pink", 2600);
        } else {
          say(idleLines[Math.floor(Math.random() * idleLines.length)], "", 2200);
        }
      }
    }
    idleLoop();
  }, 20000 + Math.random() * 12000);
})();
setInterval(function () {
  if (mode !== "walk" && Date.now() - lastAct > 90000 && curPose === "idle") {
    setPose(isLow() ? "sit" : "sleep");
  }
}, 8000);
setTimeout(function () {
  setPose("hi");
  say("来了", "pink", 1800);
  backToIdle(2000);
}, 2500);
</script>
</body>
</html>
