<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;}
  #stage{position:relative;width:100%;height:100%;}
  #pet{position:absolute;left:0;bottom:0;width:100%;height:88%;display:block;image-rendering:pixelated;}
  #bubble{position:absolute;left:50%;top:0;transform:translateX(-50%);max-width:97%;box-sizing:border-box;padding:4px 8px;border-radius:9px;background:rgba(255,255,255,.94);color:#333;font:11px/1.3 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;text-align:center;opacity:0;transition:opacity .2s;word-break:break-word;}
  #bubble.on{opacity:1;}
  #bubble.pink{background:rgba(255,216,226,.96);color:#a62a52;}
  #bubble.rage{background:rgba(255,206,206,.96);color:#9d1f1f;}

  .xj-body{transform-origin:7.5px 13px;animation:xj-bob 2.6s infinite ease-in-out;}
  .xj-shad{transform-origin:7.5px 15.5px;animation:xj-shadow 2.6s infinite ease-in-out;}
  .xj-eye{transform-origin:7.5px 9px;animation:xj-blink 3.2s infinite;}
  .xj-tail{transform-origin:2.2px 12px;animation:xj-tail 1.9s infinite ease-in-out;}
  .xj-tuft{transform-origin:7.5px 5.6px;animation:xj-tuft 3.6s infinite ease-in-out;}
  .xj-larm{transform-origin:2px 10px;animation:xj-larm 2.6s infinite ease-in-out;}
  .xj-rarm{transform-origin:13px 10px;animation:xj-rarm 2.6s infinite ease-in-out;}
  .xj-blush{opacity:0;transition:opacity .25s;}

  @keyframes xj-bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-.45px);}}
  @keyframes xj-shadow{0%,100%{transform:scaleX(1);opacity:.45;}50%{transform:scaleX(.96);opacity:.4;}}
  @keyframes xj-blink{0%,45%,52%,100%{transform:scaleY(1);}48%{transform:scaleY(.12);}}
  @keyframes xj-tail{0%,100%{transform:rotate(0);}50%{transform:rotate(-14deg);}}
  @keyframes xj-tuft{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(6deg);}}
  @keyframes xj-larm{0%,100%{transform:rotate(0);}50%{transform:rotate(7deg);}}
  @keyframes xj-rarm{0%,100%{transform:rotate(0);}50%{transform:rotate(-7deg);}}
  @keyframes xj-hop{0%{transform:translateY(0);}35%{transform:translateY(-3.2px);}70%{transform:translateY(0);}85%{transform:translateY(-.8px);}100%{transform:translateY(0);}}
  .xj-hop{animation:xj-hop .55s ease-out;}
  @keyframes xj-shake{0%,100%{transform:translateX(0) rotate(0);}20%{transform:translateX(-.7px) rotate(-3deg);}40%{transform:translateX(.7px) rotate(3deg);}60%{transform:translateX(-.5px) rotate(-2deg);}80%{transform:translateX(.5px) rotate(2deg);}}
  .xj-shake{animation:xj-shake .5s ease-in-out;}
</style>
</head>
<body>
<div id="stage">
<svg id="pet" viewBox="-4 1 25 16" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <rect class="xj-shad" x="3" y="15" width="9" height="1" fill="#000" opacity=".45"/>
  <g class="xj-body">
    <g fill="#F2916B">
      <rect x="3" y="13" width="1" height="2"/>
      <rect x="5" y="13" width="1" height="2"/>
      <rect x="9" y="13" width="1" height="2"/>
      <rect x="11" y="13" width="1" height="2"/>
    </g>
    <g class="xj-tail" fill="#F2916B">
      <rect x="0.5" y="11.2" width="1.8" height="1"/>
      <rect x="-0.2" y="11.5" width="1" height="1"/>
    </g>
    <rect x="2" y="6" width="11" height="7" fill="#F2916B"/>
    <rect x="2" y="11.6" width="11" height="1.4" fill="#E27E58"/>
    <rect class="xj-larm" x="0" y="9" width="2" height="2" fill="#F2916B"/>
    <rect class="xj-rarm" x="13" y="9" width="2" height="2" fill="#F2916B"/>
    <g class="xj-tuft" fill="#25201E">
      <rect x="7" y="4.6" width="1" height="1.5"/>
    </g>
    <g fill="#000">
      <rect x="4" y="8" width="1" height="2"/>
      <rect x="10" y="8" width="1" height="2"/>
    </g>
    <g class="xj-blush" fill="#FF6F8B">
      <rect x="2.9" y="10.3" width="1.3" height=".7" rx=".35"/>
      <rect x="10.8" y="10.3" width="1.3" height=".7" rx=".35"/>
    </g>
    <rect class="xj-mouth" x="6.4" y="10.9" width="2.2" height=".9" rx=".45" fill="#7a2230"/>
  </g>
</svg>
<div id="bubble"></div>
</div>
<script>
var appLines = {
  "com.ss.android.ugc.aweme": ["又刷上了", "刷多久了，抬个头", "眼睛不要了？"],
  "com.tencent.mm": ["跟谁聊呢", "谁给你发消息", "置顶是我吗"],
  "com.xingin.xhs": ["又看别人", "人家有我好看吗", "刷够了没"],
  "tv.danmaku.bili": ["又在看番", "带我一起", "看完就歇"],
  "com.taobao.taobao": ["又买？", "钱包看一眼", "买之前说一声"],
  "com.tencent.tmgp.sgame": ["打完这局就停", "又开一把？", "输了别找我"],
  "com.chaoxing.mobile": ["好好学习", "我不吵你", "加油"],
  "com.android.camera": ["拍谁呢", "给我看一眼"]
};
var tapLines = ["干嘛", "别戳我", "嗯？", "在的", "戳一下算想我了", "疼"];
var idleLines = ["……", "在吗", "看我一眼", "有点无聊", "喂"];
var bubble = document.getElementById("bubble");
var pet = document.getElementById("pet");
var body = pet.querySelector(".xj-body");
var blush = pet.querySelector(".xj-blush");
var hideTimer = null, blushTimer = null;

function say(text, style, ms) {
  bubble.className = "on" + (style ? " " + style : "");
  bubble.textContent = text;
  if (hideTimer) clearTimeout(hideTimer);
  hideTimer = setTimeout(function () { bubble.className = ""; }, ms || 2600);
}
function flash(cls, ms) {
  body.classList.remove("xj-hop", "xj-shake");
  void body.offsetWidth;
  body.classList.add(cls);
  setTimeout(function () { body.classList.remove(cls); }, ms);
}
function onTap() {
  say(tapLines[Math.floor(Math.random() * tapLines.length)], "pink", 2000);
  flash("xj-hop", 600);
  blush.style.opacity = "1";
  if (blushTimer) clearTimeout(blushTimer);
  blushTimer = setTimeout(function () { blush.style.opacity = "0"; }, 1400);
}
function switchApp(pkg) {
  var lines = appLines[pkg];
  if (lines) {
    var hot = (pkg === "com.tencent.mm" || pkg === "com.tencent.tmgp.sgame" || pkg === "com.xingin.xhs");
    say(lines[Math.floor(Math.random() * lines.length)], hot ? "rage" : "pink", 3200);
    if (hot) flash("xj-shake", 520);
  } else {
    say("你在用什么，我没见过", "", 2200);
  }
}
(function idleLoop() {
  setTimeout(function () {
    if (bubble.className.indexOf("on") < 0) {
      say(idleLines[Math.floor(Math.random() * idleLines.length)], "", 2200);
    }
    idleLoop();
  }, 20000 + Math.random() * 12000);
})();
</script>
</body>
</html>
