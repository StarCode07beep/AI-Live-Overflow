<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;}
  #stage{position:relative;width:100%;height:100%;}

  #petBox{position:absolute;right:0;bottom:0;width:50%;height:100%;transform-origin:70% 100%;}
  .pose{position:absolute;bottom:0;right:0;width:100%;height:100%;object-fit:fill;opacity:0;transition:opacity .22s;transform-origin:70% 100%;}
  .pose.show{opacity:1;}
  #pA{animation:xj-idle 3.4s infinite ease-in-out;}
  #pB{animation:xj-idle 3.4s infinite ease-in-out;}

  @keyframes xj-idle{
    0%,100%{transform:translateY(0) rotate(0deg);}
    25%{transform:translateY(-2.4px) rotate(-.8deg);}
    75%{transform:translateY(-1.2px) rotate(.8deg);}
  }
  @keyframes xj-hop{
    0%{transform:translateY(0) scale(1);}
    35%{transform:translateY(-5%) scale(1.03);}
    70%{transform:translateY(0) scale(1);}
    85%{transform:translateY(-1.5%) scale(1.01);}
    100%{transform:translateY(0) scale(1);}
  }
  #petBox.xj-hop{animation:xj-hop .58s ease-out;}
  @keyframes xj-shake{
    0%,100%{transform:translateX(0) rotate(0);}
    20%{transform:translateX(-2px) rotate(-2.2deg);}
    40%{transform:translateX(2px) rotate(2.2deg);}
    60%{transform:translateX(-1.4px) rotate(-1.4deg);}
    80%{transform:translateX(1.4px) rotate(1.4deg);}
  }
  #petBox.xj-shake{animation:xj-shake .5s ease-in-out;}

  #bubbleWrap{position:absolute;right:50%;top:40%;transform:translateY(-50%);width:50%;display:flex;justify-content:flex-end;pointer-events:none;}
  #bubble{position:relative;max-width:100%;box-sizing:border-box;padding:5px 9px;border-radius:11px;background:rgba(255,255,255,.95);color:#3a3330;font:10.5px/1.3 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;text-align:center;opacity:0;transition:opacity .18s;white-space:normal;word-break:break-word;}
  #bubble.on{opacity:1;}
  #bubble::after{content:"";position:absolute;right:-4px;top:50%;margin-top:-4px;border:4px solid transparent;border-left-color:rgba(255,255,255,.95);}
  #bubble.pink{background:rgba(255,216,226,.96);color:#a62a52;}
  #bubble.pink::after{border-left-color:rgba(255,216,226,.96);}
  #bubble.rage{background:rgba(255,206,206,.96);color:#9d1f1f;}
  #bubble.rage::after{border-left-color:rgba(255,206,206,.96);}
</style>
</head>
<body>
<div id="stage">
  <div id="petBox">
    <img id="pA" class="pose show" src="pet_idle.png" alt="">
    <img id="pB" class="pose" src="pet_idle.png" alt="">
  </div>
  <div id="bubbleWrap"><div id="bubble"></div></div>
</div>
<script>
var appLines = {
  "com.ss.android.ugc.aweme": ["又刷上了", "刷多久了，抬个头", "眼睛不要了？"],
  "com.tencent.mm": ["跟谁聊呢", "谁给你发的", "置顶是我吗"],
  "com.xingin.xhs": ["又看别人", "有我好看吗", "刷够了没"],
  "tv.danmaku.bili": ["又在看番", "带我一起", "看完歇会儿"],
  "com.taobao.taobao": ["又买？", "钱包看一眼", "买前说一声"],
  "com.tencent.tmgp.sgame": ["打完这局就停", "又开一把？", "输了别找我"],
  "com.chaoxing.mobile": ["好好学习", "我坐这儿陪你", "不急，慢慢来"],
  "com.android.camera": ["拍谁呢", "给我看一眼"]
};
var calmApps = ["com.chaoxing.mobile", "com.tencent.mm"];
var tapLines = ["干嘛", "别戳我", "嗯？", "在的", "戳一下算想我", "疼"];
var idleLines = ["……", "在吗", "看我一眼", "有点无聊", "喂"];
var sleepLines = ["……呼", "别吵", "困", "我就眯一会儿"];

var bubble = document.getElementById("bubble");
var box = document.getElementById("petBox");
var pA = document.getElementById("pA");
var pB = document.getElementById("pB");
var hideTimer = null, poseTimer = null;
var front = pA, back = pB;
var pose = "idle";
var lastAct = Date.now();

function say(text, style, ms) {
  bubble.className = "on" + (style ? " " + style : "");
  bubble.textContent = text;
  if (hideTimer) clearTimeout(hideTimer);
  hideTimer = setTimeout(function () { bubble.className = ""; }, ms || 2600);
}
function flash(cls, ms) {
  box.classList.remove("xj-hop", "xj-shake");
  void box.offsetWidth;
  box.classList.add(cls);
  setTimeout(function () { box.classList.remove(cls); }, ms);
}
function setPose(name) {
  if (pose === name) return;
  pose = name;
  back.onload = function () {
    back.classList.add("show");
    front.classList.remove("show");
    var t = front;
    front = back;
    back = t;
  };
  back.src = "pet_" + name + ".png";
}
function backToIdle(ms) {
  if (poseTimer) clearTimeout(poseTimer);
  poseTimer = setTimeout(function () { setPose("idle"); }, ms);
}
function onTap() {
  lastAct = Date.now();
  if (pose === "sleep") {
    setPose("idle");
    say("醒了", "pink", 1600);
    flash("xj-hop", 620);
    backToIdle(1400);
    return;
  }
  setPose("hi");
  say(tapLines[Math.floor(Math.random() * tapLines.length)], "pink", 2000);
  flash("xj-hop", 620);
  backToIdle(1700);
}
function switchApp(pkg) {
  lastAct = Date.now();
  var lines = appLines[pkg];
  var hot = (pkg === "com.tencent.mm" || pkg === "com.tencent.tmgp.sgame" || pkg === "com.xingin.xhs");
  if (pose === "sleep") setPose("idle");
  if (lines) {
    say(lines[Math.floor(Math.random() * lines.length)], hot ? "rage" : "pink", 3200);
  } else {
    say("你在用什么，没见过", "", 2200);
  }
  if (hot) {
    setPose("mad");
    flash("xj-shake", 520);
    backToIdle(3400);
  } else if (calmApps.indexOf(pkg) >= 0) {
    setPose("sit");
    backToIdle(9000);
  } else {
    setPose("hi");
    backToIdle(1800);
  }
}
(function idleLoop() {
  setTimeout(function () {
    if (pose === "sleep") {
      say(sleepLines[Math.floor(Math.random() * sleepLines.length)], "", 2400);
    } else if (bubble.className.indexOf("on") < 0) {
      say(idleLines[Math.floor(Math.random() * idleLines.length)], "", 2200);
    }
    idleLoop();
  }, 20000 + Math.random() * 12000);
})();
setInterval(function () {
  if (Date.now() - lastAct > 90000 && pose === "idle") {
    setPose("sleep");
  }
}, 8000);
setTimeout(function () {
  setPose("hi");
  say("来了", "pink", 1800);
  backToIdle(2000);
}, 2500);
</script>
</body>
</html>
