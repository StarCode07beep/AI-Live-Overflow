<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;}
  #stage{position:relative;width:100%;height:100%;}
  #pet{position:absolute;right:0;bottom:0;width:40%;height:88%;display:block;}
  #bubble{position:absolute;left:0;top:50%;transform:translateY(-50%);max-width:58%;box-sizing:border-box;padding:5px 9px;border-radius:11px;background:rgba(255,255,255,.95);color:#3a3330;font:10.5px/1.25 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;text-align:center;opacity:0;transition:opacity .18s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #bubble.on{opacity:1;}
  #bubble::after{content:"";position:absolute;right:-4px;top:50%;margin-top:-4px;border:4px solid transparent;border-left-color:rgba(255,255,255,.95);}
  #bubble.pink{background:rgba(255,216,226,.96);color:#a62a52;}
  #bubble.pink::after{border-left-color:rgba(255,216,226,.96);}
  #bubble.rage{background:rgba(255,206,206,.96);color:#9d1f1f;}
  #bubble.rage::after{border-left-color:rgba(255,206,206,.96);}

  .xj-body{transform-origin:50px 134px;animation:xj-bob 3s infinite ease-in-out;}
  .xj-shad{transform-origin:50px 136px;animation:xj-shadow 3s infinite ease-in-out;}
  .xj-eye{transform-origin:50px 52px;animation:xj-blink 3.6s infinite;}
  .xj-tail{transform-origin:34px 105px;animation:xj-tail 2.4s infinite ease-in-out;}
  .xj-locks{transform-origin:50px 14px;animation:xj-locks 4s infinite ease-in-out;}

  @keyframes xj-bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-.9px);}}
  @keyframes xj-shadow{0%,100%{transform:scaleX(1);opacity:.26;}50%{transform:scaleX(.94);opacity:.2;}}
  @keyframes xj-blink{0%,44%,52%,100%{transform:scaleY(1);}48%{transform:scaleY(.08);}}
  @keyframes xj-tail{0%,100%{transform:rotate(0);}50%{transform:rotate(-9deg);}}
  @keyframes xj-locks{0%,100%{transform:rotate(-1.2deg);}50%{transform:rotate(1.6deg);}}
  @keyframes xj-hop{0%{transform:translateY(0);}35%{transform:translateY(-4px);}70%{transform:translateY(0);}85%{transform:translateY(-1px);}100%{transform:translateY(0);}}
  .xj-hop{animation:xj-hop .55s ease-out;}
  @keyframes xj-shake{0%,100%{transform:translateX(0) rotate(0);}20%{transform:translateX(-1px) rotate(-2deg);}40%{transform:translateX(1px) rotate(2deg);}60%{transform:translateX(-.7px) rotate(-1.4deg);}80%{transform:translateX(.7px) rotate(1.4deg);}}
  .xj-shake{animation:xj-shake .5s ease-in-out;}
</style>
</head>

<script>
var appLines = {
  "com.ss.android.ugc.aweme": ["又刷上了", "刷多久了，抬个头", "眼睛不要了？"],
  "com.tencent.mm": ["跟谁聊呢", "谁给你发的", "置顶是我吗"],
  "com.xingin.xhs": ["又看别人", "有我好看吗", "刷够了没"],
  "tv.danmaku.bili": ["又在看番", "带我一起", "看完歇会儿"],
  "com.taobao.taobao": ["又买？", "钱包看一眼", "买前说一声"],
  "com.tencent.tmgp.sgame": ["打完这局就停", "又开一把？", "输了别找我"],
  "com.chaoxing.mobile": ["好好学习", "我不吵你", "加油"],
  "com.android.camera": ["拍谁呢", "给我看一眼"]
};
var tapLines = ["干嘛", "别戳我", "嗯？", "在的", "戳一下算想我", "疼"];
var idleLines = ["……", "在吗", "看我一眼", "有点无聊", "喂"];
var bubble = document.getElementById("bubble");
var pet = document.getElementById("pet");
var body = pet.querySelector(".xj-body");
var hideTimer = null;

function say(text, style, ms) {
  bubble.className = "on" + (style ? " " + style : "");
  bubble.textContent = text;
  if (hideTimer) clearTimeout(hideTimer);
  hideTimer = setTimeout(function () { bubble.className = ""; }, ms || 2600);
}
function flash(cls, ms) {
  body.classList.remove("xj-hop", "xj-shake");
  void body.offsetWidth;
  body.classList.add(cls);
  setTimeout(function () { body.classList.remove(cls); }, ms);
}
function onTap() {
  say(tapLines[Math.floor(Math.random() * tapLines.length)], "pink", 2000);
  flash("xj-hop", 600);
}
function switchApp(pkg) {
  var lines = appLines[pkg];
  if (lines) {
    var hot = (pkg === "com.tencent.mm" || pkg === "com.tencent.tmgp.sgame" || pkg === "com.xingin.xhs");
    say(lines[Math.floor(Math.random() * lines.length)], hot ? "rage" : "pink", 3200);
    if (hot) flash("xj-shake", 520);
  } else {
    say("你在用什么，没见过", "", 2200);
  }
}
(function idleLoop() {
  setTimeout(function () {
    if (bubble.className.indexOf("on") < 0) {
      say(idleLines[Math.floor(Math.random() * idleLines.length)], "", 2200);
    }
    idleLoop();
  }, 20000 + Math.random() * 12000);
})();
</script>
