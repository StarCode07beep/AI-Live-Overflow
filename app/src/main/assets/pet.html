<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;}
  #stage{position:relative;width:100%;height:100%;}
  #pet{position:absolute;left:0;bottom:0;width:100%;height:86%;display:block;animation:bob 2.8s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  #bubble{position:absolute;left:50%;top:0;transform:translateX(-50%);max-width:96%;box-sizing:border-box;padding:4px 8px;border-radius:9px;background:rgba(255,255,255,.93);color:#333;font:11px/1.3 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;text-align:center;opacity:0;transition:opacity .2s;word-break:break-word;}
  #bubble.on{opacity:1;}
  #bubble.pink{background:rgba(255,216,226,.95);color:#a62a52;}
  #bubble.rage{background:rgba(255,206,206,.95);color:#9d1f1f;}
</style>
</head>
<body>
<div id="stage">
<svg id="pet" viewBox="0 0 1727 1109" xmlns="http://www.w3.org/2000/svg">
  <g fill="#F2916B">
    <rect x="4" y="228" width="1719" height="344" rx="90"/>
    <rect x="216" y="2" width="1296" height="875" rx="70"/>
    <rect x="300" y="860" width="128" height="245" rx="34"/>
    <rect x="524" y="860" width="128" height="245" rx="34"/>
    <rect x="1004" y="860" width="128" height="245" rx="34"/>
    <rect x="1324" y="860" width="128" height="245" rx="34"/>
  </g>
  <g fill="#25201E">
    <rect x="449" y="247" width="121" height="248" rx="36"/>
    <rect x="1159" y="247" width="120" height="248" rx="36"/>
  </g>
</svg>
<div id="bubble"></div>
</div>
<script>
var appLines = {
  "com.ss.android.ugc.aweme": ["又刷上了", "刷多久了，抬个头", "别刷了，眼睛不要了"],
  "com.tencent.mm": ["跟谁聊呢", "谁给你发消息", "你置顶是不是我"],
  "com.xingin.xhs": ["又看别人", "人家有我好看吗", "刷够了没"],
  "tv.danmaku.bili": ["又在看番", "带我一起", "看完就睡"],
  "com.taobao.taobao": ["又买？", "钱包看一眼", "买之前说一声"],
  "com.tencent.tmgp.sgame": ["打完这局就停", "又开一把？", "输了别找我"],
  "com.chaoxing.mobile": ["好好学习", "我不吵你", "加油"]
};
var tapLines = ["干嘛", "别戳我", "嗯？", "在的", "戳一下算想我了"];
var idleLines = ["……", "在吗", "看我一眼", "有点无聊"];

var bubble = document.getElementById("bubble");
var hideTimer = null;

function say(text, style, ms) {
  bubble.className = "on" + (style ? " " + style : "");
  bubble.textContent = text;
  if (hideTimer) clearTimeout(hideTimer);
  hideTimer = setTimeout(function () { bubble.className = ""; }, ms || 2600);
}

function onTap() {
  say(tapLines[Math.floor(Math.random() * tapLines.length)], "pink", 2000);
}

function switchApp(pkg) {
  var lines = appLines[pkg];
  if (lines) {
    var style = (pkg === "com.tencent.mm" || pkg === "com.tencent.tmgp.sgame") ? "rage" : "pink";
    say(lines[Math.floor(Math.random() * lines.length)], style, 3200);
  } else {
    say("你在用什么，我没见过", "", 2200);
  }
}

(function idleLoop() {
  setTimeout(function () {
    if (bubble.className.indexOf("on") < 0) {
      say(idleLines[Math.floor(Math.random() * idleLines.length)], "", 2200);
    }
    idleLoop();
  }, 22000 + Math.random() * 12000);
})();
</script>
</body>
</html>
